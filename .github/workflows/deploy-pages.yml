name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopping
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shopping/package-lock.json

      - name: Install dependencies
        # lockfile 是在 Windows 上生成的，缺少 Linux 平台的可选依赖（@emnapi/*），
        # npm ci 会因 "in sync" 校验直接失败，所以这里用 npm install。
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # Pages 站点地址是 https://<用户>.github.io/<仓库名>/，基路径必须带上仓库名
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shopping/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
