<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2b2f36" />
    <meta name="description" content="喜乐严选 · 产地直供的地方特产与养生好物。支持在线下单、48 小时发货、7 天无理由退换。" />
    <title>喜乐严选 · 产地直供好物</title>

    <!-- 分享卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="喜乐严选" />
    <meta property="og:title" content="喜乐严选 · 产地直供好物" />
    <meta property="og:description" content="产地直供的地方特产与养生好物，支持在线下单、48 小时发货、7 天无理由退换。" />
    <meta property="og:url" content="https://wujaiwei-cmd.github.io/shopping-platform/" />
    <meta property="og:image" content="https://wujaiwei-cmd.github.io/shopping-platform/images/qnlss.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 结构化数据：让搜索引擎知道这是一个店铺 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "喜乐严选",
        "description": "产地直供的地方特产与养生好物",
        "url": "https://wujaiwei-cmd.github.io/shopping-platform/",
        "image": "https://wujaiwei-cmd.github.io/shopping-platform/images/qnlss.webp",
        "priceRange": "¥79 - ¥2399",
        "currenciesAccepted": "CNY",
        "paymentAccepted": "微信支付, 支付宝"
      }
    </script>

    <style>
      /* 首屏骨架：JS 包还没下载完时先显示，挂载后会被 Vue 直接替换掉 */
      html, body { margin: 0; padding: 0; background: #f5f5f5; }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #2b2f36 0%, #1f2329 100%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        z-index: 1;
      }
      .boot-logo {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 6px;
        text-indent: 6px;
      }
      .boot-sub {
        margin: -6px 0 0;
        font-size: 12px;
        letter-spacing: 2px;
        color: rgba(255, 255, 255, 0.55);
      }
      .boot-bar {
        width: 168px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.18);
      }
      .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #ff6a28;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot-tip {
        margin: 0;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.45);
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash">
        <div class="boot-logo">购物平台</div>
        <p class="boot-sub">VUE 3 · SPRING BOOT</p>
        <div class="boot-bar"></div>
        <p class="boot-tip">正在加载页面…</p>
      </div>
    </div>
    <noscript>
      <div style="padding:40px;text-align:center;font-family:sans-serif;color:#333">
        这个页面需要开启 JavaScript 才能使用，请换用 Chrome / Edge / Safari 等现代浏览器打开。
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
